/* ======================= ROUTER (hash-based, all in one file) ======================= */
function useHashRoute() {
  const [hash, setHash] = useState(window.location.hash || "#/");
  useEffect(() => {
    const onChange = () => { setHash(window.location.hash || "#/"); window.scrollTo(0, 0); };
    window.addEventListener("hashchange", onChange);
    return () => window.removeEventListener("hashchange", onChange);
  }, []);
  return hash;
}

function useScrollReveal(deps) {
  useEffect(() => {
    const els = document.querySelectorAll(".reveal, .brush-underline");
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in-view"); io.unobserve(e.target); } });
    }, { threshold: 0.15 });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, deps || []);
}

/* ======================= PAGE: VEHICULES ======================= */
const CATS = ["Tous", "Scooters", "Vespa", "Vélos électriques", "Vélos", "Quads", "Trottinettes"];

function VehiclesPage({ hash }) {
  const query = hash.includes("?") ? hash.split("?")[1] : "";
  const params = new URLSearchParams(query);
  const initial = params.get("cat") || "Tous";
  const [active, setActive] = useState(CATS.includes(initial) ? initial : "Tous");

  useEffect(() => {
    const q = new URLSearchParams(hash.includes("?") ? hash.split("?")[1] : "");
    const c = q.get("cat") || "Tous";
    if (CATS.includes(c)) setActive(c);
  }, [hash]);

  const list = useMemo(() => (active === "Tous" ? VEHICLES : VEHICLES.filter((v) => v.category === active)), [active]);

  return (
    <main className="max-w-7xl mx-auto px-5 md:px-8 pt-12 pb-24">
      <div className="flex items-center gap-2 text-brand-red font-semibold text-sm mb-2 reveal"><span>🚩</span> Notre flotte complète</div>
      <h1 className="font-display text-4xl sm:text-5xl mb-3 reveal">Tous nos véhicules</h1>
      <p className="text-black/60 max-w-lg mb-8 reveal">Choisissez le véhicule qui correspond à votre trajet et réservez-le en quelques secondes via WhatsApp.</p>

      <div className="flex flex-wrap gap-2 mb-10">
        {CATS.map((c) => (
          <button key={c} onClick={() => setActive(c)}
            className={`px-4 py-2 rounded-full text-sm font-medium border transition-colors ${active === c ? "bg-brand-red text-white border-brand-red" : "border-black/15 text-black/70 hover:border-brand-red hover:text-brand-red"}`}>
            {c}
          </button>
        ))}
      </div>

      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6">
        {list.map((v, i) => (
          <div key={v.id} className="reveal bg-white rounded-2xl overflow-hidden shadow-sm hover:shadow-lg transition-shadow flex flex-col" style={{ transitionDelay: `${(i % 3) * 90}ms` }}>
            <img src={v.img} alt={v.name} className="w-full h-48 object-cover" loading="lazy" />
            <div className="p-5 flex flex-col flex-1">
              <p className="text-xs text-brand-red font-semibold uppercase tracking-wide">{v.category}</p>
              <p className="font-semibold text-lg mt-1">{v.name}</p>
              <p className="text-sm text-black/55 mt-2 flex-1">{v.desc}</p>
              <div className="flex items-center justify-between mt-4">
                <div><span className="text-brand-red font-bold text-lg">{v.price}</span><span className="text-black/50 text-sm"> {v.unit}</span></div>
                <span className="text-xs text-black/50">⚙ {v.tag}</span>
              </div>
              <a href={`#/reservation?vehicle=${v.id}`} className="btn-magnetic mt-4 text-center bg-brand-red text-white font-semibold py-2.5 rounded-full text-sm">Réserver ce véhicule</a>
            </div>
          </div>
        ))}
      </div>
      {list.length === 0 && <p className="text-center text-black/50 py-16">Aucun véhicule dans cette catégorie pour le moment.</p>}
    </main>
  );
}

/* ======================= PAGE: RESERVATION ======================= */
function Field({ label, error, children }) {
  return (<label className="block mb-5"><span className="text-sm font-medium text-black/80">{label}</span><div className="mt-1.5">{children}</div>{error && <span className="text-xs text-brand-red mt-1 block">{error}</span>}</label>);
}
const inputClass = "w-full px-4 py-3 rounded-xl border border-black/15 bg-white focus:outline-none focus:ring-2 focus:ring-brand-red focus:border-transparent text-sm";

function ReservationPage({ hash }) {
  const query = hash.includes("?") ? hash.split("?")[1] : "";
  const params = new URLSearchParams(query);
  const preselected = VEHICLES.find((v) => v.id === params.get("vehicle"));

  const [form, setForm] = useState({ name: "", phone: "", vehicleId: preselected ? preselected.id : "", startDate: "", duration: "", notes: "" });
  const [errors, setErrors] = useState({});
  const [sent, setSent] = useState(false);

  useEffect(() => {
    const q = new URLSearchParams(hash.includes("?") ? hash.split("?")[1] : "");
    const v = VEHICLES.find((veh) => veh.id === q.get("vehicle"));
    if (v) setForm((f) => ({ ...f, vehicleId: v.id }));
  }, [hash]);

  const set = (key) => (e) => setForm({ ...form, [key]: e.target.value });

  function validate() {
    const errs = {};
    if (!form.name.trim()) errs.name = "Merci d'indiquer votre nom.";
    if (!form.phone.trim()) errs.phone = "Merci d'indiquer un numéro de téléphone.";
    else if (!/^[0-9+ ]{8,}$/.test(form.phone.trim())) errs.phone = "Numéro de téléphone invalide.";
    if (!form.vehicleId) errs.vehicleId = "Merci de choisir un véhicule.";
    if (!form.startDate) errs.startDate = "Merci d'indiquer une date.";
    if (!form.duration.trim()) errs.duration = "Merci d'indiquer la durée souhaitée.";
    setErrors(errs);
    return Object.keys(errs).length === 0;
  }

  function handleSubmit(e) {
    e.preventDefault();
    if (!validate()) return;
    const vehicle = VEHICLES.find((v) => v.id === form.vehicleId);
    const lines = [
      `Salam ! Je voudrais réserver un véhicule chez BE FREE Marrakech.`, ``,
      `👤 Nom : ${form.name}`, `📞 Téléphone : ${form.phone}`,
      `🛵 Véhicule : ${vehicle ? vehicle.name : form.vehicleId}`,
      `📅 Date de début : ${form.startDate}`, `⏱️ Durée souhaitée : ${form.duration}`,
    ];
    if (form.notes.trim()) lines.push(`📝 Note : ${form.notes.trim()}`);
    setSent(true);
    window.location.href = buildWhatsAppLink(lines.join("\n"));
  }

  return (
    <main className="max-w-3xl mx-auto px-5 md:px-8 pt-12 pb-24">
      <div className="flex items-center gap-2 text-brand-red font-semibold text-sm mb-2 reveal"><span>💬</span> Réservation</div>
      <h1 className="font-display text-4xl sm:text-5xl mb-3 reveal">Réservez votre véhicule</h1>
      <p className="text-black/60 mb-10 reveal">Remplissez ce formulaire, votre demande sera envoyée directement sur WhatsApp pour confirmer votre réservation.</p>

      <form onSubmit={handleSubmit} className="reveal bg-white rounded-2xl shadow-sm p-6 sm:p-8">
        <div className="grid sm:grid-cols-2 gap-x-6">
          <Field label="Nom complet" error={errors.name}><input type="text" value={form.name} onChange={set("name")} placeholder="Votre nom" className={inputClass} /></Field>
          <Field label="Téléphone / WhatsApp" error={errors.phone}><input type="tel" value={form.phone} onChange={set("phone")} placeholder="06 xx xx xx xx" className={inputClass} /></Field>
        </div>
        <Field label="Véhicule souhaité" error={errors.vehicleId}>
          <select value={form.vehicleId} onChange={set("vehicleId")} className={inputClass}>
            <option value="">Choisissez un véhicule</option>
            {VEHICLES.map((v) => (<option key={v.id} value={v.id}>{v.name} — {v.price} {v.unit}</option>))}
          </select>
        </Field>
        <div className="grid sm:grid-cols-2 gap-x-6">
          <Field label="Date de début" error={errors.startDate}><input type="date" value={form.startDate} onChange={set("startDate")} className={inputClass} /></Field>
          <Field label="Durée souhaitée" error={errors.duration}><input type="text" value={form.duration} onChange={set("duration")} placeholder="ex : 1 journée, 3 heures..." className={inputClass} /></Field>
        </div>
        <Field label="Message / précisions (optionnel)"><textarea value={form.notes} onChange={set("notes")} rows="3" placeholder="Livraison à l'hôtel, casque supplémentaire..." className={inputClass}></textarea></Field>
        <button type="submit" className="btn-magnetic w-full flex items-center justify-center gap-2 bg-brand-red text-white font-semibold py-3.5 rounded-full shadow-lg mt-2">
          <WhatsAppIcon className="w-5 h-5" /> {sent ? "Ouverture de WhatsApp..." : "Envoyer ma demande sur WhatsApp"}
        </button>
        <p className="text-xs text-black/40 text-center mt-4">En cliquant sur "Envoyer", WhatsApp s'ouvre avec votre demande déjà rédigée. Il ne vous reste qu'à l'envoyer.</p>
      </form>
    </main>
  );
}

/* ======================= APP / ROUTE SWITCH ======================= */
function App() {
  const hash = useHashRoute();
  const path = hash.replace(/^#/, "").split("?")[0].split("#")[0] || "/";
  useScrollReveal([hash]);

  let Page;
  if (path === "/" || path === "") Page = <HomePage />;
  else if (path === "/vehicules") Page = <VehiclesPage hash={hash} />;
  else if (path === "/agence") Page = <AgencePage />;
  else if (path === "/reservation") Page = <ReservationPage hash={hash} />;
  else Page = <HomePage />;

  return (
    <React.Fragment>
      <Navbar hash={hash} />
      <div key={path} className="page-enter">{Page}</div>
      <Footer />
      <WhatsAppFab />
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
