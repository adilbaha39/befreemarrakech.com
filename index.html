<script>
  (function() {
    var KEY = "bf_splash_seen";
    var el = document.getElementById("bf-splash");
    try { if (sessionStorage.getItem(KEY)) { if (el) el.remove(); return; } } catch (e) {}
    if (!el) return;
    var startTime = Date.now();
    var minTime = 1200, maxTime = 2500, hidden = false;
    function hideSplash() {
      if (hidden) return; hidden = true;
      if (!el.parentNode) return;
      el.classList.add("hide");
      setTimeout(function() { if (el.parentNode) el.remove(); }, 700);
      try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
    }
    if (document.readyState === "complete") { setTimeout(hideSplash, minTime); }
    else {
      window.addEventListener("load", function() {
        var wait = Math.max(0, minTime - (Date.now() - startTime));
        setTimeout(hideSplash, wait);
      });
    }
    setTimeout(hideSplash, maxTime);
  })();

  (function() {
    if (window.matchMedia("(hover: none)").matches || window.innerWidth < 1024) return;
    var cursor = document.getElementById("bf-cursor");
    if (!cursor) return;
    document.addEventListener("mousemove", function(e) {
      cursor.style.left = e.clientX + "px";
      cursor.style.top = e.clientY + "px";
      cursor.classList.add("visible");
    });
    document.addEventListener("mouseleave", function() { cursor.classList.remove("visible"); });
    document.addEventListener("mouseover", function(e) {
      if (e.target.closest("a, button, .card-hover, input, select, textarea")) {
        cursor.classList.add("grow");
      } else {
        cursor.classList.remove("grow");
      }
    });
  })();
</script>

function detectLang() {
  try { const saved = localStorage.getItem("bf_lang"); if (saved && LANGS.includes(saved)) return saved; } catch (e) {}
  const nav = (navigator.language || "fr").toLowerCase();
  if (nav.startsWith("ar")) return "ar";
  if (nav.startsWith("en")) return "en";
  if (nav.startsWith("es")) return "es";
  return "fr";
}

const LangContext = createContext({ lang: "fr", t: (k) => k, setLang: () => {} });
function useLang() { return useContext(LangContext); }

function LangProvider({ children }) {
  const [lang, setLangState] = useState(detectLang());
  useEffect(() => {
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === "ar" ? "rtl" : "ltr";
  }, [lang]);
  function setLang(l) { setLangState(l); try { localStorage.setItem("bf_lang", l); } catch (e) {} }
  function t(path) {
    const parts = path.split(".");
    let node = T[lang];
    for (const p of parts) { node = node && node[p]; }
    return node === undefined ? path : node;
  }
  return (<LangContext.Provider value={{ lang, t, setLang }}>{children}</LangContext.Provider>);
}

}
function formatPrice(amountEUR, lang) {
  if (lang === "ar") return `${amountEUR * 10} درهم`;
  if (lang === "en") return `$${amountEUR}`;
  return `${amountEUR}€`;
}
function formatVehiclePrice(v, lang, t) {
  const main = `${formatPrice(v.priceEUR, lang)} ${t(`units.${v.unitKey}`)}`;
  if (v.price2EUR) return `${main} · ${formatPrice(v.price2EUR, lang)} ${t(`units.${v.unit2Key}`)}`;
  return main;
}

/* Highlights keywords inside a text with styled <strong> */
function Highlight({ text, keywords }) {
  if (!text) return null;
  if (!Array.isArray(keywords) || !keywords.length) return <>{text}</>;
  const escaped = keywords.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const regex = new RegExp(`(${escaped.join("|")})`, "gi");
  const parts = String(text).split(regex);
  const lowerSet = new Set(keywords.map(w => w.toLowerCase()));
  return (
    <>
      {parts.map((p, i) =>
        p && lowerSet.has(p.toLowerCase())
          ? <strong key={i} className="hl-key">{p}</strong>
          : <React.Fragment key={i}>{p}</React.Fragment>
      )}
    </>
  );
}

function useHashRoute() {
  const [hash, setHash] = useState(window.location.hash || "#/");
  useEffect(() => {
    const onChange = () => { setHash(window.location.hash || "#/"); window.scrollTo(0, 0); };
    window.addEventListener("hashchange", onChange);
    return () => window.removeEventListener("hashchange", onChange);
  }, []);
  return hash;
}
function useScrollReveal(deps) {
  useEffect(() => {
    const els = document.querySelectorAll(".reveal, .brush-underline");
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add("in-view"); io.unobserve(e.target); } });
    }, { threshold: 0.15 });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, deps || []);
}

function ScrollProgress() {
  const [progress, setProgress] = useState(0);
  useEffect(() => {
    const onScroll = () => {
      const h = document.documentElement.scrollHeight - window.innerHeight;
      setProgress(h > 0 ? (window.scrollY / h) : 0);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return <div className="scroll-progress" style={{ transform: `scaleX(${progress})` }} aria-hidden="true" />;
}

function Counter({ end, duration = 1800, suffix = "" }) {
  const [count, setCount] = useState(0);
  const ref = useRef(null);
  const started = useRef(false);
  useEffect(() => {
    const io = new IntersectionObserver(([entry]) => {
      if (entry.isIntersecting && !started.current) {
        started.current = true;
        const start = performance.now();
        const animate = (now) => {
          const p = Math.min((now - start) / duration, 1);
          const eased = 1 - Math.pow(1 - p, 3);
          setCount(Math.floor(eased * end));
          if (p < 1) requestAnimationFrame(animate);
          else setCount(end);
        };
        requestAnimationFrame(animate);
      }
    }, { threshold: 0.3 });
    if (ref.current) io.observe(ref.current);
    return () => io.disconnect();
  }, [end, duration]);
  return <span ref={ref}>{count}{suffix}</span>;
}

}

function Field({ label, error, children }) {
  return (<label className="block mb-5"><span className="text-sm font-medium text-black/80">{label}</span><div className="mt-1.5">{children}</div>{error && <span className="text-xs text-brand-red mt-1 block">{error}</span>}</label>);
}
const inputClass = "w-full px-4 py-3 rounded-xl border border-black/15 bg-white focus:outline-none focus:ring-2 focus:ring-brand-red focus:border-transparent text-sm";

function ReservationPage({ hash }) {
  const { t, lang } = useLang();
  const params = new URLSearchParams(hash.includes("?") ? hash.split("?")[1] : "");
  const preselected = VEHICLES.find((v) => v.id === params.get("vehicle"));
  const [form, setForm] = useState({ name: "", phone: "", vehicleId: preselected ? preselected.id : "", departDate: "", returnDate: "", notes: "" });
  const [errors, setErrors] = useState({});
  const [sent, setSent] = useState(false);
  useEffect(() => {
    const q = new URLSearchParams(hash.includes("?") ? hash.split("?")[1] : "");
    const v = VEHICLES.find((veh) => veh.id === q.get("vehicle"));
    if (v) setForm((f) => ({ ...f, vehicleId: v.id }));
  }, [hash]);
  const set = (key) => (e) => setForm({ ...form, [key]: e.target.value });
  function validate() {
    const errs = {};
    if (!form.name.trim()) errs.name = t("reservation.errName");
    if (!form.phone.trim()) errs.phone = t("reservation.errPhone");
    else if (!/^\+?[0-9][0-9\s\-().]{7,}$/.test(form.phone.trim())) errs.phone = t("reservation.errPhoneInvalid");
    if (!form.vehicleId) errs.vehicleId = t("reservation.errVehicle");
    if (!form.departDate) errs.departDate = t("reservation.errDepart");
    else if (form.departDate < new Date().toISOString().split("T")[0]) errs.departDate = t("reservation.errDatePast");
    if (!form.returnDate) errs.returnDate = t("reservation.errReturn");
    else if (form.returnDate < form.departDate) errs.returnDate = t("reservation.errReturnBefore");
    setErrors(errs);
    return Object.keys(errs).length === 0;
  }
  function handleSubmit(e) {
    e.preventDefault();
    if (!validate()) return;
    const vehicle = VEHICLES.find((v) => v.id === form.vehicleId);
    const lines = [
      t("reservation.waIntro"), ``,
      `👤 ${t("reservation.waName")} : ${form.name}`,
      `📞 ${t("reservation.waPhone")} : ${form.phone}`,
      `🛵 ${t("reservation.waVehicle")} : ${vehicle ? vehicle.nameKey : form.vehicleId}`,
      `📅 ${t("reservation.waDepart")} : ${form.departDate}`,
      `📅 ${t("reservation.waReturn")} : ${form.returnDate}`,
    ];
    if (form.notes.trim()) lines.push(`📝 ${t("reservation.waNote")} : ${form.notes.trim()}`);
    lines.push(``, `📍 ${t("agence.addressFull")}`);
    setSent(true);
    window.location.href = buildWhatsAppLink(lines.join("\n"));
    setTimeout(() => setSent(false), 3500);
  }
  return (
    <main className="max-w-3xl mx-auto px-5 md:px-8 pt-40 pb-24">
      <div className="flex items-center gap-2 text-brand-red font-semibold text-sm mb-2 reveal"><WhatsAppIcon className="w-4 h-4" /> {t("reservation.tag")}</div>
      <h1 className="font-display text-4xl sm:text-5xl mb-3 reveal">{t("reservation.title")}</h1>
      <p className="text-black/60 mb-10 reveal">{t("reservation.desc")}</p>
      <form onSubmit={handleSubmit} className="reveal bg-white rounded-2xl shadow-sm p-6 sm:p-8">
        <div className="grid sm:grid-cols-2 gap-x-6">
          <Field label={t("reservation.name")} error={errors.name}><input type="text" value={form.name} onChange={set("name")} placeholder={t("reservation.namePh")} className={inputClass} /></Field>
          <Field label={t("reservation.phone")} error={errors.phone}><input type="tel" value={form.phone} onChange={set("phone")} placeholder={t("reservation.phonePh")} className={inputClass} /></Field>
        </div>
        <Field label={t("reservation.vehicle")} error={errors.vehicleId}>
          <select value={form.vehicleId} onChange={set("vehicleId")} className={inputClass}>
            <option value="">{t("reservation.vehicleChoose")}</option>
            {VEHICLES.map((v) => (<option key={v.id} value={v.id}>{v.nameKey} — {formatVehiclePrice(v, lang, t)}</option>))}
          </select>
        </Field>
        <div className="grid sm:grid-cols-2 gap-x-6">
          <Field label={t("reservation.startDate")} error={errors.departDate}>
            <input type="date" value={form.departDate} min={new Date().toISOString().split("T")[0]} onChange={set("departDate")} className={inputClass} />
          </Field>
          <Field label={t("reservation.returnDate")} error={errors.returnDate}>
            <input type="date" value={form.returnDate} min={form.departDate || new Date().toISOString().split("T")[0]} onChange={set("returnDate")} className={inputClass} />
          </Field>
        </div>
        <Field label={t("reservation.notes")}><textarea value={form.notes} onChange={set("notes")} rows="3" placeholder={t("reservation.notesPh")} className={inputClass}></textarea></Field>
        <button type="submit" className="btn-magnetic w-full flex items-center justify-center gap-2 bg-brand-green text-white font-semibold py-3.5 rounded-full shadow-lg mt-2 hover:bg-brand-greendark">
          <WhatsAppIcon className="w-5 h-5" /> {sent ? t("reservation.sending") : t("reservation.submit")}
        </button>
        <p className="text-xs text-black/40 text-center mt-4">{t("reservation.hint")}</p>
      </form>
    </main>
  );
}

function AppInner() {
  const hash = useHashRoute();
  const path = hash.replace(/^#/, "").split("?")[0].split("#")[0] || "/";
  const { t, lang } = useLang();
  useScrollReveal([hash, lang]);
  useEffect(() => {
    const titles = {
      "/": `BE FREE Marrakech — Location de véhicules`,
      "/vehicules": `${t("nav.vehicules")} — BE FREE Marrakech`,
      "/agence": `${t("nav.agence")} — BE FREE Marrakech`,
      "/reservation": `${t("reservation.title")} — BE FREE Marrakech`,
    };
    document.title = titles[path] || titles["/"];
  }, [path, t]);
  let Page;
  if (path === "/" || path === "") Page = <HomePage />;
  else if (path === "/vehicules") Page = <VehiclesPage />;
  else if (path === "/agence") Page = <AgencePage />;
  else if (path === "/reservation") Page = <ReservationPage hash={hash} />;
  else Page = <HomePage />;
  return (
    <React.Fragment>
      <ScrollProgress />
      <Navbar hash={hash} />
      <div key={path} className="page-enter">{Page}</div>
      <Footer />
      <WhatsAppFab />
    </React.Fragment>
  );
}

function App() { return (<LangProvider><AppInner /></LangProvider>); }
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
